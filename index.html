
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angry Rabbits: Meme Mayhem</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:10px}
h1{margin:5px;font-size:clamp(22px,4vw,34px)}
#info{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px;font-weight:bold}
#game{display:block;width:min(100%,1000px);height:auto;margin:auto;background:#87ceeb;touch-action:none;border:3px solid #fff;border-radius:8px}
.controls{padding:10px}
button{border:0;border-radius:9px;padding:11px 16px;margin:4px;font-size:15px;font-weight:bold;cursor:pointer;background:#facc15;color:#171717}
button:hover{filter:brightness(1.1)}
#message{min-height:24px;font-weight:bold;padding:5px}
small{display:block;padding:0 12px 15px;color:#d1d5db}
</style>
</head>
<body>
<header>
<h1>🐰 Angry Rabbits: Meme Mayhem</h1>
<div id="info">
<span id="levelLabel">Level 1 / 50</span>
<span id="tries">Tries: 5 / 5</span>
<span id="score">Score: 0</span>
</div>
</header>

<canvas id="game" width="1000" height="560"></canvas>

<div class="controls">
<button id="reset">🔄 Restart Level</button>
<button id="next">➡️ Next Level</button>
<button id="aimButton">🎯 Show Aim: ON</button>
</div>
<div id="message">Drag the rabbit backward, then release to launch!</div>
<small>Drag to aim • Hit the towers to knock them down • Clear the hawks to win!</small>

<script>
(() => {
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const GROUND = 495;
const GRAVITY = 850;

const themes = [
["Doge World","#83d7ff","#ffe9a8","VERY WOW"],
["Among Us","#372b60","#e45a77","SUS RABBITS"],
["Stonks City","#62c8a5","#e9f2b0","TO THE MOON"],
["Galaxy Brain","#17123f","#aa7aff","BIG BRAIN TIME"],
["Backrooms","#d6d1a3","#fff0c0","WHERE ARE WE?"],
["Banana Dimension","#ffdf45","#fff6b0","BANANA MODE"],
["Pixel Paradise","#39c4b7","#a5f3fc","8-BIT MAYHEM"],
["Meme Mountain","#79b9ff","#e5f5ff","MAXIMUM MEME"],
["Rescue City","#ffb86b","#ffe3a3","CITY RESCUE MISSION"],
["Cat Internet","#ffb4d5","#fff0f7","MEOW MAYHEM"],
["Rainbow Road","#e8a2ff","#fff1b8","RAINBOW POWER"],
["Desert Doge","#efb56e","#ffe6a6","MUCH DESERT"],
["Frog Pond","#74d69a","#c6f6a8","RIBBIT MODE"],
["Ice Cream Planet","#a3e7ff","#ffe0f0","BRAIN FREEZE"],
["Space Station","#20264c","#98d7ff","RABBIT ASTRONAUT"],
["Jungle Meme","#45ae75","#d4f59a","JUNGLE CHAOS"],
["Volcano Valley","#7f3343","#ffb06a","HOT MEMES"],
["Candy Kingdom","#f4a5d7","#fff0a8","SWEET VICTORY"],
["Robot Factory","#64748b","#cbd5e1","BEEP BOOP"],
["Ocean Internet","#1679ad","#8de9f5","DEEP MEMES"],
["Haunted Mansion","#30244e","#a9a1d6","SPOOKY BUNNY"],
["Disco Fever","#6c43b7","#ffda71","DANCE MODE"],
["Cloud Kingdom","#a6d8ff","#ffffff","CLOUD NINE"],
["Lava Planet","#8d3030","#ffc15e","LAVA HOP"],
["Jelly World","#61c8c5","#d1fff3","VERY JIGGLY"],
["Toy Box","#ed9d55","#fff0b5","PLAYTIME"],
["Neon City","#111a48","#39f5e9","NEON SPEED"],
["Mushroom Forest","#66945d","#e5c6ff","MUSHROOM POWER"],
["Moon Base","#505b82","#dce6ff","ONE SMALL HOP"],
["Watermelon World","#59b76e","#ff9f9f","JUICY MEMES"],
["Volleyball Beach","#63c9ed","#fff3b2","BEACH BALL"],
["Giant Arcade","#29285f","#ff75c3","INSERT COIN"],
["Crystal Cave","#51408c","#b9f7ff","SHINY STUFF"],
["Snow Day","#b8e7ff","#ffffff","SNOW WAY"],
["Supermarket","#e4b65e","#f8e7a2","SHOPPING CART"],
["Pirate Island","#268c9c","#ffe0a0","ARRR YOU READY"],
["Farm Frenzy","#8ccf71","#fff0ae","FARM FRENZY"],
["Skate Park","#f49d55","#c8f5ff","RADICAL RABBITS"],
["Music Planet","#503f93","#ffa7df","DROP THE BEAT"],
["Lemon Galaxy","#293d8a","#fff17a","SOUR POWER"],
["Haunted Arcade","#412e68","#a9fff0","GHOST MODE"],
["Dinosaur Valley","#75ae61","#ffd18d","PREHISTORIC LOL"],
["Gummy Galaxy","#5544a8","#ffb6e6","GUMMY TIME"],
["Space Carnival","#403b91","#ffd166","STEP RIGHT UP"],
["Mountain Meme","#7394a9","#f0f7ff","PEAK PERFORMANCE"],
["Flower Planet","#73bf82","#ffc9ec","FLOWER POWER"],
["Cyber Forest","#1b6359","#76ffe0","CYBER HOP"],
["Dream Dimension","#8075ca","#ffddfb","DREAM BIG"],
["Golden Meme Land","#d6a62e","#fff1a1","GOLDEN BUNNY"],
["Final Meme Boss","#292044","#ffcb69","ULTIMATE MAYHEM"]
];

let level = 1, shots = 5, score = 0, aimOn = true;
let rabbit, blocks = [], hawks = [], particles = [];
let dragging = false, won = false, gameOver = false;
let dragX = 0, dragY = 0, lastTime = 0;

const sling = {x:125, y:GROUND-38};
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

function makeRabbit(){
  rabbit = {
    x:sling.x, y:sling.y, r:17,
    vx:0, vy:0, alive:true, launched:false,
    age:0, hits:0
  };
}

function addBlock(x,y,w,h,kind="wood"){
  blocks.push({
    x,y,w,h,kind,
    vx:0,vy:0,angle:0,spin:0,
    hp:1,settled:false
  });
}

function buildLevel(n){
  level = clamp(n,1,50);
  shots = 5;
  won = false;
  gameOver = false;
  dragging = false;
  blocks = [];
  hawks = [];
  particles = [];
  makeRabbit();

  if(level === 9){
    // Special, non-destructive city rescue mission.
    // The bunny plane collects stars and rescues hawks.
    for(let i=0;i<7;i++){
      addBlock(510+i*62, GROUND-20, 48, 20, "building");
    }
    for(let i=0;i<5;i++){
      addBlock(550+i*90, GROUND-90-(i%2)*35, 65, 85+(i%2)*35, "building");
    }
    hawks.push(
      {x:500,y:285,r:15,alive:true},
      {x:690,y:215,r:15,alive:true},
      {x:860,y:300,r:15,alive:true}
    );
  } else {
    // Procedurally build a different tower layout each level.
    const towers = 2 + Math.floor((level-1)/5);
    const startX = 550;
    for(let t=0;t<Math.min(towers,5);t++){
      const x = startX + t*78;
      const height = 2 + ((level+t)%3);
      for(let row=0;row<height;row++){
        addBlock(x, GROUND-30-row*32, 58, 28, "wood");
      }
      if(height >= 3){
        addBlock(x+8, GROUND-30-height*32, 42, 22, "carrot");
      }
    }
    const hawkCount = Math.min(1+Math.floor((level-1)/3),5);
    for(let i=0;i<hawkCount;i++){
      hawks.push({
        x:610+i*70,
        y:GROUND-75-(i%2)*75,
        r:15,
        alive:true
      });
    }
  }
  updateUI();
  $("message").textContent = level===9
    ? "Rescue mission! Collect the stars and reach the hawks!"
    : "Drag the rabbit backward and release to launch!";
}

function updateUI(){
  $("levelLabel").textContent = `Level ${level} / 50`;
  $("tries").textContent = `Tries: ${shots} / 5`;
  $("score").textContent = `Score: ${score}`;
}

function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)*W/r.width,
    y:(e.clientY-r.top)*H/r.height
  };
}

canvas.addEventListener("pointerdown",e=>{
  if(won||gameOver||!rabbit||!rabbit.alive||rabbit.launched||shots<=0)return;
  const p=pointerPos(e);
  if(Math.hypot(p.x-rabbit.x,p.y-rabbit.y)<45){
    dragging=true;
    dragX=p.x; dragY=p.y;
    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const p=pointerPos(e);
  rabbit.x=clamp(p.x,sling.x-85,sling.x+12);
  rabbit.y=clamp(p.y,sling.y-85,sling.y+85);
});

canvas.addEventListener("pointerup",()=>{
  if(!dragging)return;
  dragging=false;
  const dx=sling.x-rabbit.x;
  const dy=sling.y-rabbit.y;
  const power=6.8;
  if(Math.hypot(dx,dy)>9){
    rabbit.vx=dx*power;
    rabbit.vy=dy*power;
    rabbit.launched=true;
    rabbit.age=0;
    shots--;
    $("message").textContent="FLY, BUNNY, FLY!";
    updateUI();
  } else {
    makeRabbit();
  }
});

$("reset").onclick=()=>buildLevel(level);
$("next").onclick=()=>buildLevel(level===50?1:level+1);
$("aimButton").onclick=()=>{
  aimOn=!aimOn;
  $("aimButton").textContent=`🎯 Show Aim: ${aimOn?"ON":"OFF"}`;
};

function burst(x,y,color){
  for(let i=0;i<9;i++){
    particles.push({
      x,y,vx:rand(-130,130),vy:rand(-180,30),
      life:rand(.3,.7),color
    });
  }
}

// Circle-versus-rectangle collision.
// This makes tower blocks genuinely stop the rabbit.
function circleBlockHit(c,b){
  const cx=clamp(c.x,b.x,b.x+b.w);
  const cy=clamp(c.y,b.y,b.y+b.h);
  const dx=c.x-cx, dy=c.y-cy;
  return dx*dx+dy*dy < c.r*c.r;
}

function hitBlock(b){
  if(!rabbit.launched)return;
  const cx=clamp(rabbit.x,b.x,b.x+b.w);
  const cy=clamp(rabbit.y,b.y,b.y+b.h);
  let dx=rabbit.x-cx, dy=rabbit.y-cy;
  const d=Math.hypot(dx,dy)||1;
  dx/=d; dy/=d;

  // Bounce the rabbit away from the surface.
  const impact=Math.max(100,Math.hypot(rabbit.vx,rabbit.vy));
  rabbit.vx=dx*impact*.42;
  rabbit.vy=dy*impact*.42-35;
  rabbit.hits++;

  // Transfer impact to the block and make it tip.
  b.vx += dx*impact*.48;
  b.vy += Math.min(-20,dy*impact*.12);
  const torque=(rabbit.x-(b.x+b.w/2));
  b.spin += clamp(torque/Math.max(1,b.w),-1,1)*impact*.006;
  b.settled=false;
  burst(cx,cy,"#ffe2a8");
}

function update(dt){
  if(dt>.04)dt=.04;
  const floor=GROUND;

  // Rabbit physics and tower collisions.
  if(rabbit && rabbit.alive && rabbit.launched && !won && !gameOver){
    rabbit.age+=dt;
    rabbit.vy+=GRAVITY*dt;
    rabbit.x+=rabbit.vx*dt;
    rabbit.y+=rabbit.vy*dt;

    // Hit each tower block.
    for(const b of blocks){
      if(circleBlockHit(rabbit,b)){
        hitBlock(b);
        // Move it back out of the block so it cannot get stuck.
        rabbit.x+=rabbit.vx*dt*1.5;
        rabbit.y+=rabbit.vy*dt*1.5;
      }
    }

    // Ground collision.
    if(rabbit.y+rabbit.r>floor){
      rabbit.y=floor-rabbit.r;
      if(Math.abs(rabbit.vy)>100){
        rabbit.vy=-Math.abs(rabbit.vy)*.24;
        rabbit.vx*=.78;
      }else{
        rabbit.vy=0;
        rabbit.vx*=Math.pow(.03,dt);
      }
    }

    // Rescue hawks by touching them.
    for(const h of hawks){
      if(h.alive && Math.hypot(rabbit.x-h.x,rabbit.y-h.y)<rabbit.r+h.r){
        h.alive=false;
        score+=100;
        burst(h.x,h.y,"#fff06a");
        updateUI();
      }
    }

    // Respawn when the rabbit leaves play or comes to rest.
    const resting = rabbit.y+rabbit.r>=floor-1 &&
      Math.abs(rabbit.vx)<28 && Math.abs(rabbit.vy)<28 &&
      rabbit.age>.35;
    const out = rabbit.x>W+70 || rabbit.x<-70 ||
      rabbit.y>H+100 || rabbit.age>9;

    if(resting||out){
      rabbit.alive=false;
      if(hawks.every(h=>!h.alive)){
        won=true;
        $("message").textContent=`🎉 Level ${level} cleared! Great job!`;
      }else if(shots>0){
        setTimeout(()=>{
          if(!won && !gameOver && !rabbit.alive){
            makeRabbit();
            $("message").textContent="New rabbit ready! Take another shot.";
          }
        },250);
      }else{
        gameOver=true;
        $("message").textContent="Out of tries! Press Restart Level to try again.";
      }
    }
  }

  // Physical blocks: gravity, floor response, and collisions.
  for(const b of blocks){
    b.vy+=GRAVITY*dt;
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    b.angle+=b.spin*dt;

    // Approximate the rotated block's bounding box.
    const bw=Math.abs(Math.cos(b.angle))*b.w+
             Math.abs(Math.sin(b.angle))*b.h;
    const bh=Math.abs(Math.sin(b.angle))*b.w+
             Math.abs(Math.cos(b.angle))*b.h;

    if(b.y+bh>floor){
      b.y=floor-bh;
      if(Math.abs(b.vy)>65){
        b.vy=-Math.abs(b.vy)*.14;
        b.vx*=.83;
        b.spin*=.68;
      }else{
        b.vy=0;
        b.vx*=Math.pow(.06,dt);
        b.spin*=Math.pow(.04,dt);
      }
    }
    if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)*.25}
    if(b.x+bw>W){b.x=W-bw;b.vx=-Math.abs(b.vx)*.25}
  }

  // Block-to-block collisions help towers topple instead of passing through.
  for(let pass=0;pass<2;pass++){
    for(let i=0;i<blocks.length;i++){
      const a=blocks[i];
      const aw=Math.abs(Math.cos(a.angle))*a.w+Math.abs(Math.sin(a.angle))*a.h;
      const ah=Math.abs(Math.sin(a.angle))*a.w+Math.abs(Math.cos(a.angle))*a.h;
      for(let j=i+1;j<blocks.length;j++){
        const b=blocks[j];
        const bw=Math.abs(Math.cos(b.angle))*b.w+Math.abs(Math.sin(b.angle))*b.h;
        const bh=Math.abs(Math.sin(b.angle))*b.w+Math.abs(Math.cos(b.angle))*b.h;
        const ax=a.x+aw/2, ay=a.y+ah/2, bx=b.x+bw/2, by=b.y+bh/2;
        const ox=(aw+bw)/2-Math.abs(ax-bx);
        const oy=(ah+bh)/2-Math.abs(ay-by);
        if(ox>0&&oy>0){
          if(oy<ox){
            const dir=ay<by?-1:1;
            const push=oy*.52;
            a.y+=dir*push;
            b.y-=dir*push;
            const v=(a.vy-b.vy)*.18;
            a.vy-=v;b.vy+=v;
            a.vx+=(ax-bx)*.8;
            b.vx-=(ax-bx)*.8;
          }else{
            const dir=ax<bx?-1:1;
            const push=ox*.52;
            a.x+=dir*push;b.x-=dir*push;
            const v=(a.vx-b.vx)*.3;
            a.vx-=v;b.vx+=v;
            a.spin+=dir*.4;
            b.spin-=dir*.4;
          }
        }
      }
    }
  }

  particles=particles.filter(p=>p.life>0);
  for(const p of particles){
    p.life-=dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=GRAVITY*.45*dt;
  }
}

function drawBackground(){
  const t=themes[level-1];
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,t[1]);
  grad.addColorStop(1,t[2]);
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  // Decorative stars and circles.
  for(let i=0;i<35;i++){
    const x=(i*173+31)%W;
    const y=(i*79+23)%390;
    ctx.fillStyle="rgba(255,255,255,.28)";
    ctx.beginPath();ctx.arc(x,y,2+(i%3),0,Math.PI*2);ctx.fill();
  }

  if(level===9){
    // Friendly rescue city skyline.
    for(let i=0;i<10;i++){
      const x=i*105;
      const hh=100+(i*47)%170;
      ctx.fillStyle=["#6b7280","#64748b","#475569"][i%3];
      ctx.fillRect(x,GROUND-hh,85,hh);
      for(let y=GROUND-hh+15;y<GROUND-15;y+=24){
        for(let xx=x+12;xx<x+75;xx+=24){
          ctx.fillStyle="#ffe58a";
          ctx.fillRect(xx,y,10,12);
        }
      }
    }
  }else{
    ctx.fillStyle="rgba(255,255,255,.85)";
    ctx.font="bold 29px Arial";
    ctx.fillText(t[0],25,42);
    ctx.font="bold 18px Arial";
    ctx.fillText(t[3],26,68);
  }

  ctx.fillStyle="#5aaf50";
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle="#327a39";
  ctx.fillRect(0,GROUND,W,9);
}

function drawSlingshot(){
  ctx.strokeStyle="#713f12";
  ctx.lineWidth=10;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(sling.x-10,GROUND);
  ctx.lineTo(sling.x-5,sling.y-15);
  ctx.moveTo(sling.x+12,GROUND);
  ctx.lineTo(sling.x+5,sling.y-15);
  ctx.stroke();

  ctx.strokeStyle="#9a3412";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(sling.x-5,sling.y-15);
  ctx.lineTo(rabbit&&rabbit.alive&&!rabbit.launched?rabbit.x:sling.x,
             rabbit&&rabbit.alive&&!rabbit.launched?rabbit.y:sling.y);
  ctx.lineTo(sling.x+5,sling.y-15);
  ctx.stroke();
}

function drawRabbit(){
  if(!rabbit||!rabbit.alive)return;
  const x=rabbit.x,y=rabbit.y;
  ctx.save();
  ctx.translate(x,y);
  if(rabbit.launched)ctx.rotate(Math.atan2(rabbit.vy,rabbit.vx)*.25);
  // Ears
  ctx.fillStyle="#f8fafc";
  ctx.beginPath();
  ctx.ellipse(-7,-22,6,15,-.25,0,Math.PI*2);
  ctx.ellipse(7,-23,6,15,.25,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#f9a8d4";
  ctx.beginPath();
  ctx.ellipse(-7,-22,2.5,10,-.25,0,Math.PI*2);
  ctx.ellipse(7,-23,2.5,10,.25,0,Math.PI*2);
  ctx.fill();
  // Body and face
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(0,0,17,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#111827";
  ctx.beginPath();ctx.arc(6,-4,2.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fb7185";
  ctx.beginPath();ctx.arc(11,3,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawBlocks(){
  for(const b of blocks){
    ctx.save();
    ctx.translate(b.x+b.w/2,b.y+b.h/2);
    ctx.rotate(b.angle);
    if(b.kind==="building"){
      ctx.fillStyle="#64748b";
      ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.strokeStyle="#334155";ctx.lineWidth=3;
      ctx.strokeRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.fillStyle="#fde68a";
      for(let x=-b.w/2+9;x<b.w/2-5;x+=19)
        for(let y=-b.h/2+9;y<b.h/2-5;y+=23)
          ctx.fillRect(x,y,9,12);
    }else{
      ctx.fillStyle=b.kind==="carrot"?"#f97316":"#b77942";
      ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.strokeStyle=b.kind==="carrot"?"#9a3412":"#704214";
      ctx.lineWidth=3;
      ctx.strokeRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.strokeStyle="rgba(255,255,255,.25)";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(-b.w/2+5,0);ctx.lineTo(b.w/2-5,0);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawHawks(){
  for(const h of hawks){
    if(!h.alive)continue;
    ctx.save();
    ctx.translate(h.x,h.y);
    ctx.fillStyle="#374151";
    ctx.beginPath();ctx.ellipse(0,0,17,11,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-8,0);ctx.lineTo(-25,-10);ctx.lineTo(-18,5);
    ctx.lineTo(-8,7);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(8,0);ctx.lineTo(25,-10);ctx.lineTo(18,5);
    ctx.lineTo(8,7);ctx.fill();
    ctx.fillStyle="#fbbf24";
    ctx.beginPath();ctx.moveTo(12,-2);ctx.lineTo(23,2);ctx.lineTo(12,5);ctx.fill();
    ctx.fillStyle="white";
    ctx.beginPath();ctx.arc(7,-4,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#111827";
    ctx.beginPath();ctx.arc(8,-4,1.8,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawAim(){
  if(!aimOn||!dragging||!rabbit)return;
  const dx=sling.x-rabbit.x,dy=sling.y-rabbit.y;
  ctx.fillStyle="rgba(255,255,255,.85)";
  for(let i=1;i<=20;i++){
    const t=i*.085;
    const x=sling.x+dx*6.8*t;
    const y=sling.y+dy*6.8*t+.5*GRAVITY*t*t;
    if(y>GROUND)break;
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
  }
}

function draw(){
  drawBackground();
  drawSlingshot();
  drawBlocks();
  drawHawks();
  drawAim();
  drawRabbit();

  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  if(won||gameOver){
    ctx.fillStyle="rgba(15,23,42,.75)";
    ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle="white";
    ctx.font="bold 46px Arial";
    ctx.fillText(won?"LEVEL CLEARED!":"OUT OF TRIES!",W/2,H/2-10);
    ctx.font="22px Arial";
    ctx.fillText(won?"Press Next Level to continue":"Restart the level to try again",W/2,H/2+32);
    ctx.textAlign="left";
  }
}

function frame(time){
  const dt=lastTime?(time-lastTime)/1000:0;
  lastTime=time;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

buildLevel(1);
requestAnimationFrame(frame);
})();
</script>
</body>
